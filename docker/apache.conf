ServerName localhost
ServerTokens Prod
ServerSignature Off

<Directory "/var/www/html/public">
    Options -Indexes -MultiViews
    AllowOverride None
    Require all granted
</Directory>

# Do not expose dotfiles or runtime artifacts even if accidentally placed in public/.
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<FilesMatch "\.(?:sqlite[0-9]?|db|log|bak|zip|tar|gz|sql|env)$">
    Require all denied
</FilesMatch>

<Files "web.config">
    Require all denied
</Files>

LimitRequestBody 33554432

# mod_php uses the onsuccess table; normalize before adding the always headers.
Header onsuccess unset X-Content-Type-Options
Header onsuccess unset Referrer-Policy
Header onsuccess unset X-Frame-Options
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "same-origin"
Header always set X-Frame-Options "SAMEORIGIN"

# PHP endpoints send their own nonce-aware CSP. Apply the static CSP only to assets.
<FilesMatch "\.(?:css|js|svg|png|jpe?g|webp|ico|woff2?)$">
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
</FilesMatch>
