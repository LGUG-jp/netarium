name: Lightweight CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: none

      - name: Check limited JavaScript types (development repository only)
        if: github.repository == 'LGUG-jp/netarium-dev'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Run PHP syntax check
        run: |
          echo "Running syntax check on all PHP files..."
          FAILED=0
          find . -type f -name "*.php" -print0 > "$RUNNER_TEMP/netarium-php-files"
          while IFS= read -r -d '' file; do
            if ! php -l "$file"; then
              FAILED=1
            fi
          done < "$RUNNER_TEMP/netarium-php-files"

          if [ $FAILED -ne 0 ]; then
            echo "::error::PHP syntax errors were detected."
            exit 1
          fi

          echo "All PHP files passed syntax check successfully."

      - name: Check PowerShell deployment scripts for non-ASCII characters and BOM
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          let failed = false;
          for (const name of fs.readdirSync('scripts').filter(name => name.endsWith('.ps1'))) {
            const file = path.join('scripts', name);
            const bytes = fs.readFileSync(file);
            if (bytes.some(byte => byte > 0x7f)) {
              console.error(`::error file=${file}::Non-ASCII characters detected. Deployment PowerShell scripts must be pure ASCII.`);
              failed = true;
            }
            if (bytes.length >= 3 && bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf) {
              console.error(`::error file=${file}::UTF-8 BOM detected. Deployment PowerShell scripts must not contain a BOM.`);
              failed = true;
            }
          }
          if (failed) process.exit(1);
          console.log('All deployment PowerShell scripts passed encoding check successfully.');
          NODE

      - name: Validate public snapshot without Docker
        run: |
          node scripts/export-public-snapshot.mjs --commit HEAD \
            --out-dir "$RUNNER_TEMP/netarium-public-snapshot" \
            --manifest-dir "$RUNNER_TEMP/netarium-public-snapshot-manifest"

      - name: Exercise isolated release safety boundaries (no credentials)
        if: github.repository == 'LGUG-jp/netarium-dev'
        run: node --test tests/export-public-snapshot.test.mjs tests/release-sync.test.mjs tests/release-control.test.mjs tests/release-finalize.test.mjs
