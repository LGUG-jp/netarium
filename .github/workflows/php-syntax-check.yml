name: PHP Syntax Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax-check:
    name: Check PHP Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: none

      - name: Run PHP syntax check
        run: |
          echo "Running syntax check on all PHP files..."
          FAILED=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file"; then
              FAILED=1
            fi
          done < <(find . -type f -name "*.php" -print0)

          if [ $FAILED -ne 0 ]; then
            echo "::error::PHP syntax errors were detected."
            exit 1
          fi

          echo "All PHP files passed syntax check successfully."

      - name: Check PowerShell deployment scripts for non-ASCII characters and BOM
        run: |
          echo "Checking deployment PowerShell scripts for non-ASCII characters and UTF-8 BOM..."
          FAILED=0
          for file in scripts/*.ps1; do
            if grep -P -n "[^\x00-\x7F]" "$file"; then
              echo "::error file=$file::Non-ASCII characters detected in $file. Deployment PowerShell scripts must be pure ASCII."
              FAILED=1
            fi
            if head -c 3 "$file" | grep -q $'\xEF\xBB\xBF'; then
              echo "::error file=$file::UTF-8 BOM detected in $file. Deployment PowerShell scripts must not contain a BOM."
              FAILED=1
            fi
          done

          if [ $FAILED -ne 0 ]; then
            echo "::error::PowerShell script encoding validation failed."
            exit 1
          fi

          echo "All deployment PowerShell scripts passed encoding check successfully."
