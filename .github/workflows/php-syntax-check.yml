name: PHP Syntax Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax-check:
    name: Check PHP Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          tools: none

      - name: Run PHP syntax check
        run: |
          echo "Running syntax check on all PHP files..."
          FAILED=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file"; then
              FAILED=1
            fi
          done < <(find . -type f -name "*.php" -print0)

          if [ $FAILED -ne 0 ]; then
            echo "::error::PHP syntax errors were detected."
            exit 1
          fi

          echo "All PHP files passed syntax check successfully."
