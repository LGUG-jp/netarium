name: Public snapshot check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate public snapshot without Docker
        run: |
          node scripts/export-public-snapshot.mjs --commit HEAD \
            --out-dir "$RUNNER_TEMP/netarium-public-snapshot" \
            --manifest-dir "$RUNNER_TEMP/netarium-public-snapshot-manifest"
